name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: changes
        run: |
          echo "backend_changed=false" >> $GITHUB_OUTPUT
          echo "frontend_changed=false" >> $GITHUB_OUTPUT

          if git diff --name-only HEAD~1 HEAD | grep '^backend/' > /dev/null; then
            echo "backend_changed=true" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only HEAD~1 HEAD | grep '^frontend/' > /dev/null; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LOCOMERC_PROD_EC2_HOST }}
          username: ${{ secrets.LOCOMERC_PROD_EC2_USER }}
          key: ${{ secrets.LOCOMERC_PROD_EC2_SSH_KEY }}
          script: |
            cd ~/Local-Market
            git pull origin main

            if [ "${{ steps.changes.outputs.backend_changed }}" = "true" ]; then
              echo "Backend changed – Deploying backend..."
              cd ~/Local-Market/backend
              npm install
              pm2 reload server
              pm2 restart server
            fi

            if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ]; then
              echo "Frontend changed – Rebuilding and deploying frontend"
              cd ~/Local-Market/frontend
              npm install
              npm run build
              sudo rm -rf /var/www/locomerc/*
              sudo cp -r dist/* /var/www/locomerc/
            fi
